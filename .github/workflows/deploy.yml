name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The planner is a bun server and a static page, and the page is built from
  # the same source tree. There is deliberately no build_command here: the
  # page has this deployment's origin compiled into it, that origin lives in
  # the systemd unit's environment, and a build in this workflow's SSH shell
  # would quietly bake in localhost. `bun start` builds first and serves
  # second, so the restart below is the build.
  deploy:
    uses: taciturnaxolotl/dots/.github/workflows/deploy-service.yml@main
    with:
      service: cedarplan
      health_url: https://cedarplan.dunkirk.sh/health
      db_path: /var/lib/cedarplan/data/catalog.sqlite
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
