<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>the cedarville app</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <h1>the cedarville app</h1>
      <p id="who"></p>
    </header>

    <section id="controls">
      <div class="field">
        <label for="term">term</label>
        <select id="term" disabled>
          <option value="">loading…</option>
        </select>
      </div>

      <div class="field">
        <label for="whatif">second major</label>
        <select id="whatif" disabled>
          <option value="">none</option>
        </select>
      </div>

      <div class="actions">
        <button id="capture" type="button" disabled>capture requirements</button>
        <button id="load-sections" type="button" disabled>load catalog</button>
      </div>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="progress-bar" hidden>
      <progress id="bar"></progress>
      <span id="progress-text"></span>
    </section>

    <nav id="tabs" hidden>
      <button data-view="requirements" class="on" type="button">requirements</button>
      <button data-view="overlap" type="button">overlap</button>
      <button data-view="schedule" type="button">schedule</button>
    </nav>

    <main id="outlet"></main>

    <script type="module" src="app.js"></script>
  </body>
</html>
